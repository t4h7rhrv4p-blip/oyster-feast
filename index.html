<!DOCTYPE html>
<html lang="de">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Oyster Feast</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,300;1,600&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
        <style>
            * { box-sizing: border-box; }
            html, body {
                height: 100%;
            }
            body {
                height: 100vh;
                height: 100dvh;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                background-color: #F8F9FA;
                color: #121212;
                font-family: "Lato", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
                text-align: center;
                gap: clamp(1rem, 2.5vh, 1.5rem);
                margin: 0;
                padding: clamp(1rem, 3vh, 1.5rem) 1rem;
                overflow-y: auto;
            }
            h1 {
                margin: 0;
                font-family: "Playfair Display", serif;
                font-weight: 500;
                font-size: clamp(1.8rem, 6vh, 2.6rem);
                letter-spacing: -0.02em;
                margin-bottom: 0.4rem;
            }
            p {
                margin: 0;
                font-family: "Lato", sans-serif;
                font-weight: 300;
                font-size: clamp(1rem, 2.6vh, 1.2rem);
                color: #222;
            }
            #result:empty {
                display: none;
            }
            .oyster {
                height: clamp(140px, 26vh, 240px);
                width: auto;
            }
            .btn {
                border: 1px solid #E2E8F0;
                background-color: #F8F9FA;
                color: #121212;
                padding: clamp(0.6rem, 1.8vh, 0.85rem) 1.4rem;
                cursor: pointer;
            }
            .options {
                display: flex;
                flex-direction: column;
                gap: clamp(0.5rem, 1.5vh, 0.85rem);
                width: 100%;
                max-width: 320px;
            }
            .option-btn {
                font-family: "Playfair Display", serif;
                font-size: 1.1rem;                
                transition: border-color 0.2s, background-color 0.2s;
            }
            .option-btn:hover {
                border-color: #121212;
            }
            .option-btn.selected {
                border-color: #121212;
                background-color: #121212;
                color: #F8F9FA;
            }
            .submit-btn {
                font-family: "Lato", sans-serif;
                text-transform: uppercase;
                font-size: 1rem;
                transition: opacity 0.2s;
                border-color: #121212;
                background-color: #8291a7;
                color: #F8F9FA;
                margin-top: clamp(0.5rem, 1.5vh, 1.25rem);
                display: inline-flex;
                align-items: center;
                justify-content: center;
                gap: 0.6rem;
            }
            .submit-btn svg {
                width: 1.1rem;
                height: 1.1rem;
                flex-shrink: 0;
            }
            .submit-btn:disabled {
                background-color: #E2E8F0;
                color: #121212;
                cursor: not-allowed;
                opacity: 0.7;
            }
        </style>
    </head>
    <body>
        <img class="oyster" src="oyster.svg" alt="Illustration einer Auster">
        <div>
            <h1>Oyster Feast</h1>
            <p class="subline">Wie möchtest Du sie genießen?</p>
        </div>
        <form id="oyster-form" action="https://formspree.io/f/xkjnygly" method="POST">
            <div class="options">
                <button type="button" class="btn option-btn" data-value="date" data-label="She said yes">Austern essen &mdash; du & ich</button>
                <button type="button" class="btn option-btn" data-value="voucher" data-label="She choose the voucher">Lieber solo? Gutschein hier</button>
                <input type="hidden" name="Auswahl" id="selectionInput">
                <input type="hidden" name="_subject" value="Neue Antwort: Oyster Feast">
                <input type="text" name="_gotcha" style="display:none" tabindex="-1" autocomplete="off">
                <button type="submit" class="btn submit-btn" id="submitBtn" disabled>
                    Ja, das will ich
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                        <path d="M5 12H19M19 12L13 6M19 12L13 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
            </div>
        </form>

        <p id="result"></p>
        <script>
            const form = document.getElementById('oyster-form');
            const optionButtons = document.querySelectorAll('.option-btn');
            const submitBtn = document.getElementById('submitBtn');
            const selectionInput = document.getElementById('selectionInput');
            const result = document.getElementById('result');

            const resultMessages = {
                date: 'Wundervoll! Ich freue mich schon. Lass uns bald einen Tag finden. 🦪',
                voucher: 'Perfekt! Dein Gutschein ist unterwegs. 🎁'
            };

            let selectedOption = null;

            optionButtons.forEach(btn => {
                btn.addEventListener('click', () => {
                    optionButtons.forEach(b => b.classList.remove('selected'));
                    btn.classList.add('selected');
                    selectionInput.value = btn.dataset.label;
                    selectedOption = btn.dataset.value;
                    submitBtn.disabled = false;
                });
            });

            form.addEventListener('submit', async (event) => {
                event.preventDefault();
                if (!selectionInput.value) return;

                submitBtn.disabled = true;

                try {
                    const response = await fetch(form.action, {
                        method: 'POST',
                        body: new FormData(form),
                        headers: { 'Accept': 'application/json' }
                    });

                    if (response.ok) {
                        form.hidden = true;
                        result.textContent = resultMessages[selectedOption];
                    } else {
                        result.textContent = 'Ups, das hat nicht geklappt. Bitte versuch es noch einmal.';
                        submitBtn.disabled = false;
                    }
                } catch (error) {
                    result.textContent = 'Ups, das hat nicht geklappt. Bitte versuch es noch einmal.';
                    submitBtn.disabled = false;
                }
            });
        </script>
    </body>
</html>
